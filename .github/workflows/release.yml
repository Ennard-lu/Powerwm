name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
  UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-24.04
    container:
      image: gcc:16
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates \
            git \
            cmake \
            ninja-build \
            pkg-config \
            libdrm-dev \
            libinput-dev \
            libseat-dev \
            libudev-dev \
            libvulkan-dev \
            vulkan-validationlayers \
            mesa-vulkan-drivers
          rm -rf /var/lib/apt/lists/*
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset release
      - name: Build
        run: cmake --build --preset release
      - name: Test
        run: ctest --preset release --output-on-failure
      - name: Resolve version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "PWM_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "PWM_VERSION=0.0.0-dev" >> "$GITHUB_ENV"
          fi
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          tar -C build/release -czf "dist/powerwm-${PWM_VERSION}-linux-x86_64.tar.gz" powerwm powerwm_drm_bringup
          (cd dist && sha256sum ./*.tar.gz > SHA256SUMS)
          ls -l dist
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
